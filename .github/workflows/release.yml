name: Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: find dist -type f -exec sha256sum {} + > SHA256SUMS

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 #v3.0.4
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

          body: |
            ## Deployed
            [**timeuntil**](https://29miaoet.github.io/timeuntil/)

            ## Features
            - ✅ Dropdown menu to select different end times
            - ✅ Options to toggle between different schools
            - ✅ Responsive UI layout
            - ✅ Modern HTML, CSS and TypeScript code
            - ✅ Modern npm build stack

          files: |
            dist/*
            SHA256SUMS
